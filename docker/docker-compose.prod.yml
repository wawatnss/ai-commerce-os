version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-commerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_commerce_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_commerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-commerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_commerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-commerce-redis
    volumes:
      - redis_data:/data
    networks:
      - ai-commerce-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: ai-commerce-api
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ai_commerce}:${POSTGRES_PASSWORD:-ai_commerce_password}@postgres:5432/${POSTGRES_DB:-ai_commerce}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost", "http://localhost:3000", "http://localhost:3001"]}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-commerce-network
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: ai-commerce-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      - api
    networks:
      - ai-commerce-network
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: ai-commerce-admin
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      ADMIN_BASE_PATH: /admin
    depends_on:
      - api
    networks:
      - ai-commerce-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ai-commerce-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - certbot_data:/etc/letsencrypt
      # - certbot_www:/var/www/certbot
    depends_on:
      - api
      - web
      - admin
    networks:
      - ai-commerce-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  ai-commerce-network:
    driver: bridge
